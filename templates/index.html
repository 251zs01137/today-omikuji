<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今日の運勢おみくじ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: #493d3d; background: linear-gradient(135deg, #fff1f2, #fff8e9);
    }
    main {
      width: min(100%, 520px); padding: 42px 30px; text-align: center;
      background: rgba(255,255,255,.92); border: 1px solid #f5dddd;
      border-radius: 28px; box-shadow: 0 16px 45px rgba(126, 83, 83, .12);
    }
    .symbol { font-size: 42px; margin-bottom: 8px; }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 6vw, 34px); letter-spacing: .08em; }
    .lead { color: #8c7777; margin: 0 0 28px; }
    .draw {
      display: inline-block; padding: 14px 34px; border-radius: 999px;
      background: #e98594; color: white; text-decoration: none; font-weight: bold;
      box-shadow: 0 5px 0 #ce6878; transition: transform .15s;
    }
    .draw:hover { transform: translateY(-2px); }
    .result {
      margin: 30px auto 0; padding: 24px 18px; max-width: 370px;
      border: 1px dashed #e9caca; border-radius: 18px; background: #fffafa;
    }
    .result-label { color: #9b8585; font-size: 13px; letter-spacing: .15em; }
    .fortune { margin: 8px 0 12px; font-size: 48px; font-weight: 800; }
    .message { line-height: 1.8; margin: 0 0 16px; }
    .item { display: inline-block; padding: 8px 14px; border-radius: 999px; background: #fff0d9; }
    footer { margin-top: 28px; color: #b19e9e; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="symbol">🌸</div>
    <h1>今日の運勢おみくじ</h1>
    <p class="lead">ボタンを押して、今日の運勢を占ってみよう。</p>
    <a class="draw" href="/draw">おみくじを引く</a>
    {% if fortune %}
    <section class="result" aria-live="polite">
      <div class="result-label">TODAY'S FORTUNE</div>
      <div class="fortune" style="color: {{ fortune.color }}">{{ fortune.name }}</div>
      <p class="message">{{ fortune.message }}</p>
      <div class="item">🎁 ラッキーアイテム：{{ fortune.item }}</div>
    </section>
    {% endif %}
    <footer>毎日をちょっと楽しくする、小さなおみくじ。</footer>
  </main>
</body>
</html>
